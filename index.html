<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guck mal! & Kuu Kuu POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root {
  --primary: #E62E2D;
  --primary-soft: #FFF0F0;
  --accent: #F5A623;
  --accent-soft: #FFF8EB;
  --ink: #2B1810;
  --ink-muted: #7C6356;
  --navy: #1E4DB7;
  --bg: #FAF7F2;
  --card: #FFFFFF;
  --border: #EAE0D2;
  --border-strong: #D9C9B4;
  --green: #15803D;
  --green-soft: #DCFCE7;
  --red: #DC2626;
  --red-soft: #FEE2E2;
  --shadow-sm: 0 2px 8px rgba(43, 24, 16, 0.04);
  --shadow-md: 0 8px 24px rgba(43, 24, 16, 0.07);
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', 'Prompt', system-ui, -apple-system, sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .display-font {
  font-family: 'Fredoka', 'Prompt', sans-serif;
  letter-spacing: -0.01em;
}
h2 { margin: 0 0 14px; font-size: 22px; font-weight: 600; }
h3 { margin: 0 0 10px; font-size: 16.5px; font-weight: 600; }

/* Sticky Glass Header */
header {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 30;
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.brand-area {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(230, 46, 45, 0.25);
  transition: background 0.25s;
}
.brand-title h1 {
  margin: 0;
  font-size: 19px;
  color: var(--ink);
  line-height: 1.15;
}
.brand-sub {
  font-size: 11.5px;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.sync-pill {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 1px 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 6px;
  transition: all 0.18s ease;
}
.sync-pill:hover {
  background: #fff;
  color: var(--ink);
  border-color: var(--primary);
  box-shadow: var(--shadow-sm);
}
.sync-pill.spinning {
  opacity: 0.6;
  pointer-events: none;
}
.mode-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #16A34A;
  display: inline-block;
}
.mode-dot.local { background: #F59E0B; }

nav {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  background: var(--bg);
  padding: 4px;
  border-radius: 14px;
  border: 1px solid var(--border);
}
.tab {
  border: 0;
  background: transparent;
  color: var(--ink-muted);
  padding: 7px 14px;
  border-radius: 10px;
  font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.tab:hover { color: var(--ink); background: rgba(255,255,255,0.6); }
.tab.on {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

main {
  padding: 18px 20px 60px;
  max-width: 1280px;
  margin: 0 auto;
}

/* Segmented Brand Switcher */
.brand-switch {
  display: inline-flex;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 4px;
  gap: 4px;
  box-shadow: var(--shadow-sm);
}
.brand-pill {
  border: 0;
  background: transparent;
  color: var(--ink-muted);
  padding: 8px 16px;
  border-radius: 10px;
  font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.brand-pill.on {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

/* Layout Grids */
.pos-grid {
  display: grid;
  grid-template-columns: 1fr 410px;
  gap: 18px;
  align-items: start;
}
@media (max-width: 940px) {
  .pos-grid { grid-template-columns: 1fr; }
}
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 820px) {
  .two-col { grid-template-columns: 1fr; }
}

/* Cards & Panels */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

/* Menu Grid */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
  gap: 12px;
}
.m-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  cursor: pointer;
  transition: all 0.18s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-sm);
  position: relative;
}
.m-card:hover {
  transform: translateY(-2px);
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}
.m-card:active { transform: scale(0.98); }
.m-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg);
  margin-bottom: 9px;
}
.m-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.m-ph {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  background: var(--accent-soft);
}
.m-type-tag {
  position: absolute;
  top: 6px;
  left: 6px;
  background: rgba(43, 24, 16, 0.72);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.m-title {
  font-weight: 600;
  font-size: 13.5px;
  color: var(--ink);
  line-height: 1.3;
  margin-bottom: 4px;
}
.m-price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
}
.m-price {
  font-weight: 700;
  font-size: 15px;
  color: var(--primary);
}
.m-add-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--primary-soft);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
}

/* Form Elements & Buttons */
input, select, textarea {
  font-family: inherit;
  font-size: 13.5px;
  padding: 8px 11px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
input[type=number] { width: 88px; }

.btn {
  font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { filter: brightness(0.94); }
.btn-accent { background: var(--accent); color: var(--ink); }
.btn-accent:hover:not(:disabled) { filter: brightness(0.95); }
.btn-navy { background: var(--navy); color: #fff; }
.btn-navy:hover:not(:disabled) { filter: brightness(0.94); }
.btn-outline { background: #fff; border-color: var(--border-strong); color: var(--ink); }
.btn-outline:hover:not(:disabled) { background: var(--bg); border-color: var(--ink-muted); }
.btn-danger-outline { background: #fff; border-color: #FCA5A5; color: var(--red); }
.btn-danger-outline:hover:not(:disabled) { background: var(--red-soft); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }

.chip {
  border: 1.5px solid var(--border);
  background: #fff;
  color: var(--ink-muted);
  border-radius: 20px;
  padding: 4px 11px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.chip:hover { border-color: var(--ink-muted); color: var(--ink); }
.chip.on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--ink);
}
.chip.primary-on {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
}
.badge-green { background: var(--green-soft); color: var(--green); }
.badge-red { background: var(--red-soft); color: var(--red); }
.badge-amber { background: var(--accent-soft); color: #9A5B00; }
.badge-neutral { background: var(--bg); color: var(--ink-muted); border: 1px solid var(--border); }

/* Cart & Order Lines */
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cart-line {
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
}
.cart-line:last-child { border-bottom: 0; }
.qty-box {
  display: inline-flex;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.qty-box button {
  border: 0;
  background: transparent;
  width: 26px;
  height: 26px;
  font-weight: 700;
  cursor: pointer;
  color: var(--ink);
}
.qty-box button:hover { background: var(--border); }
.qty-box span { padding: 0 8px; font-weight: 600; font-size: 13px; }

.tot-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.tot-table td { padding: 4px 0; font-size: 13.5px; border: 0; }
.tot-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.tot-divider td { border-top: 1px dashed var(--border-strong); padding-top: 8px; }
.big-num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pos { color: var(--green); }
.neg { color: var(--red); }

/* Timeline */
.tl-step {
  background: var(--bg);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 8px 10px;
  margin: 6px 0;
  font-size: 13px;
}

/* Tables */
table.data-table { width: 100%; border-collapse: collapse; }
table.data-table th {
  background: var(--bg);
  color: var(--ink-muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 9px 10px;
  border-bottom: 1.5px solid var(--border);
  text-align: left;
  white-space: nowrap;
}
table.data-table td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
table.data-table tr:hover td { background: rgba(250, 247, 242, 0.65); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

/* KPI Grid */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.kpi-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 16px;
  box-shadow: var(--shadow-sm);
}
.kpi-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.kpi-label { font-size: 12.5px; font-weight: 600; color: var(--ink-muted); }
.kpi-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.kpi-val {
  font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
  font-size: 25px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 4px;
}
.kpi-sub { font-size: 12px; color: var(--ink-muted); }

/* Progress Bar */
.prog-track {
  height: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 99px;
  transition: width 0.5s ease;
}

/* Recipe Checkbox Selector */
.recipe-box {
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  background: var(--bg);
}
.chk-list {
  max-height: 250px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
  padding-right: 4px;
}
.chk-item {
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 7px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  transition: border-color 0.15s;
}
.chk-item.checked {
  border-color: var(--primary);
  background: var(--primary-soft);
}
.chk-label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  flex: 1;
  font-size: 13px;
  font-weight: 500;
}
.chk-label input[type=checkbox] {
  width: 16px;
  height: 16px;
  accent-color: var(--primary);
  cursor: pointer;
}

/* Settings Rows */
.set-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.set-row:last-child { border-bottom: 0; }
.set-info { flex: 1; }
.set-title { font-weight: 600; font-size: 14px; color: var(--ink); }
.set-desc { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.input-unit {
  display: inline-flex;
  align-items: center;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
}
.input-unit input {
  border: 0;
  border-radius: 0;
  width: 105px;
  text-align: right;
  font-weight: 600;
}
.input-unit input:focus { box-shadow: none; }
.input-unit span {
  padding: 0 10px;
  background: var(--bg);
  color: var(--ink-muted);
  font-size: 12.5px;
  font-weight: 600;
  border-left: 1px solid var(--border);
  align-self: stretch;
  display: flex;
  align-items: center;
}

/* Modal & Toast */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(43, 24, 16, 0.48);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 60;
  padding: 16px;
}
.modal-card {
  background: #fff;
  border-radius: 18px;
  max-width: 440px;
  width: 100%;
  padding: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
}
#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 10px 18px;
  border-radius: 99px;
  font-size: 13.5px;
  font-weight: 500;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  display: none;
  z-index: 100;
}
.chart-wrap {
  position: relative;
  height: 250px;
  width: 100%;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-area">
      <div class="brand-logo" id="brandLogo">🍗</div>
      <div class="brand-title">
        <h1 id="brandTitle">Guck mal! POS</h1>
        <div class="brand-sub">
          <span class="mode-dot" id="modeDot"></span>
          <span id="modeText">Connecting…</span>
          <button id="syncBtn" class="sync-pill" onclick="syncLiveState(true)" title="Refresh data from Google Sheets & Drive">🔄 <span id="syncText">Sync</span></button>
        </div>
      </div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main id="app">
  <div class="panel" style="text-align:center;padding:40px">Loading POS workspace…</div>
</main>

<div id="modalRoot"></div>
<div id="toast"></div>

const STORAGE_KEY = 'GUCKMAL_POS_LOCAL_V2';

function loadLocalDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.menu) && parsed.ing && parsed.set) {
        parsed.cancelled = parsed.cancelled || [];
        parsed.inv = parsed.inv || [];
        parsed.sales = parsed.sales || [];
        return parsed;
      }
    }
  } catch (e) {}
  const fresh = createLocalSeedState();
  saveLocalDB(fresh);
  return fresh;
}

function saveLocalDB(db) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

const LocalAPI = {
  getState: () => loadLocalDB(),
  saveOrder: (rows) => {
    const db = loadLocalDB();
    db.sales.push(...rows);
    saveLocalDB(db);
    return true;
  },
  deleteOrder: (id) => {
    const db = loadLocalDB();
    db.sales = db.sales.filter(r => r[1] !== id);
    saveLocalDB(db);
    return true;
  },
  cancelOrder: (id, reason) => {
    const db = loadLocalDB();
    const maxHours = (db.set && db.set.order_edit_hours != null) ? +db.set.order_edit_hours : 24;
    const target = db.sales.filter(r => r[1] === id);
    if (!target.length) return false;
    if (maxHours > 0) {
      const orderTime = new Date(String(target[0][0]).replace(' ', 'T')).getTime();
      if (!isNaN(orderTime) && (Date.now() - orderTime) / 3600000 > maxHours) {
        throw new Error(`Order #${id} is locked. Modifications are not allowed after ${maxHours} hours.`);
      }
    }
    const nowStr = new Date().toLocaleString('sv', { timeZone: 'Asia/Bangkok' });
    target.forEach(r => db.cancelled.push([nowStr, reason || 'Cancelled by user', ...r]));
    db.sales = db.sales.filter(r => r[1] !== id);
    saveLocalDB(db);
    return true;
  },
  restoreOrder: (id) => {
    const db = loadLocalDB();
    const target = db.cancelled.filter(r => r[3] === id);
    target.forEach(r => db.sales.push(r.slice(2)));
    db.cancelled = db.cancelled.filter(r => r[3] !== id);
    saveLocalDB(db);
    return true;
  },
  replaceOrder: (id, rows) => {
    const db = loadLocalDB();
    const maxHours = (db.set && db.set.order_edit_hours != null) ? +db.set.order_edit_hours : 24;
    const target = db.sales.filter(r => r[1] === id);
    if (maxHours > 0 && target.length) {
      const orderTime = new Date(String(target[0][0]).replace(' ', 'T')).getTime();
      if (!isNaN(orderTime) && (Date.now() - orderTime) / 3600000 > maxHours) {
        throw new Error(`Order #${id} is locked. Modifications are not allowed after ${maxHours} hours.`);
      }
    }
    db.sales = db.sales.filter(r => r[1] !== id);
    db.sales.push(...rows);
    saveLocalDB(db);
    return true;
  },
  saveIng: (brand, name, price) => {
    const db = loadLocalDB();
    if (db.ing[name]) {
      db.ing[name].price = +price;
      db.ing[name].cost = (+price) / (db.ing[name].batch || 1);
      saveLocalDB(db);
    }
    return true;
  },
  addIng: (brand, name, price, batch, unit, cat) => {
    const db = loadLocalDB();
    const bQty = +batch || 1;
    db.ing[name] = {
      brand,
      cat: cat || 'ing',
      row: Object.keys(db.ing).length + 2,
      price: +price,
      batch: bQty,
      unit: unit || 'unit',
      cost: (+price) / bQty
    };
    saveLocalDB(db);
    return true;
  },
  saveSet: (key, val) => {
    const db = loadLocalDB();
    db.set[key] = +val;
    saveLocalDB(db);
    return true;
  },
  addMenu: (brand, row, img) => {
    const db = loadLocalDB();
    const imgUrl = (img && img.data) ? ('data:' + (img.mime || 'image/jpeg') + ';base64,' + img.data) : (row[4] || '');
    db.menu.push({
      brand,
      row: db.menu.filter(m => m.brand === brand).length + 2,
      name: row[0],
      type: row[1],
      inn: +row[2],
      dl: +row[3],
      img: imgUrl,
      food: row[5] || '',
      pack: row[6] || '',
      steps: row[7] || '',
      sp: +row[8] || 0
    });
    saveLocalDB(db);
    return true;
  },
  updateMenu: (brand, rowIdx, row, img) => {
    const db = loadLocalDB();
    const idx = db.menu.findIndex(m => m.brand === brand && m.row === rowIdx);
    if (idx >= 0) {
      const imgUrl = (img && img.data) ? ('data:' + (img.mime || 'image/jpeg') + ';base64,' + img.data) : row[4];
      db.menu[idx] = {
        ...db.menu[idx],
        name: row[0],
        type: row[1],
        inn: +row[2],
        dl: +row[3],
        img: imgUrl,
        food: row[5] || '',
        pack: row[6] || '',
        steps: row[7] || '',
        sp: +row[8] || 0
      };
      saveLocalDB(db);
    }
    return true;
  },
  addInvest: (brand, date, item, amount) => {
    const db = loadLocalDB();
    db.inv.push([date, item, +amount, brand, db.inv.length + 2]);
    saveLocalDB(db);
    return true;
  },
  delInvest: (brand, row) => {
    const db = loadLocalDB();
    db.inv = db.inv.filter(x => !(x[3] === brand && x[4] === row));
    saveLocalDB(db);
    return true;
  },
  savePrice: (brand, row, col, val) => {
    const db = loadLocalDB();
    const m = db.menu.find(x => x.brand === brand && x.row === row);
    if (m) {
      if (col === 3) m.inn = +val;
      else if (col === 4) m.dl = +val;
      else if (col === 9) m.sp = +val;
      saveLocalDB(db);
    }
    return true;
  }
};

// Google Apps Script web app that reads/writes both Google Sheets.
// When this page is opened as a plain .html file (or hosted anywhere else), it talks to the same script over HTTPS.
const API_URL = 'https://script.google.com/macros/s/AKfycbyL7DPUx_TkdpbwM4FBPVXExcn3GvnaUhXt7oYvoMqx0TcYyP0PF4desTwa9epJYVLIJA/exec';
const IS_LIVE = IS_GAS || !!API_URL;
const call = async (fn, ...args) => {
  if (IS_GAS) {
    return new Promise((ok, er) => google.script.run.withSuccessHandler(ok).withFailureHandler(er)[fn](...args));
  }
  if (!API_URL) return LocalAPI[fn](...args);
  let j;
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      redirect: 'follow',
      body: JSON.stringify({ fn, args })
    });
    j = await r.json();
  } catch (e) {
    if (typeof toast === 'function') toast('Cannot reach Google Sheets. Check your internet and the Apps Script deployment.');
    throw e;
  }
  if (!j.ok) {
    if (typeof toast === 'function') toast('Google Sheets error: ' + j.error);
    throw new Error(j.error);
  }
  return j.data;
};

const parsePairs = s => s ? String(s).split(';').filter(Boolean).map(x => {
  const i = x.lastIndexOf(':');
  return i > 0 ? [x.slice(0, i).trim(), +x.slice(i + 1) || 0] : null;
}).filter(Boolean) : [];

const getMenuImg = m => (m && m.img) ? m.img : (DEFAULT_IMAGES[m?.name] || '');
const ic = n => (S && S.ing[n]) ? S.ing[n].cost : 0;
const normCh = s => String(s ?? '').toLowerCase().replace(/[\s\-_]/g, '');
const matchCh = (c1, c2) => {
  if (c1 === c2) return true;
  if (!c1 || !c2) return false;
  return normCh(c1) === normCh(c2);
};
const isInStore = (channel = ch) => {
  const n = normCh(channel);
  return n === 'instore' || n === 'walkin' || n === 'dinein' || n === 'takeaway';
};
const isDel = (channel = ch) => !isInStore(channel);
const pf = m => isInStore(ch) ? m.inn : (matchCh(ch, 'Shopee') && m.sp ? m.sp : m.dl);
const roundTo9 = v => {
  if (!v || v <= 0) return 0;
  return Math.max(9, Math.round((v - 9) / 10) * 10 + 9);
};
const tf = l => l.sauces.includes('ทาร์ทาร์ซอส') ? (isDel() ? S.set.tartar_dl : S.set.tartar_in) : 0;
const unitP = l => (l.ov != null && l.ov !== '') ? +l.ov : pf(l) + tf(l);
const unitC = l => {
  if (l.fc != null) return l.fc;
  const baseCost = [...parsePairs(l.food), ...parsePairs(l.pack)].reduce((a, [n, q]) => a + q * ic(n), 0);
  const sauceCost = l.sauces.length ? l.sauces.reduce((a, s) => a + (50 / l.sauces.length) * ic(s), 0) : 0;
  return baseCost + sauceCost;
};

function calcCart() {
  const L = cart.map(l => ({
    l,
    g: l.free ? 0 : unitP(l) * l.qty,
    c: unitC(l) * l.qty
  }));
  const G = L.reduce((a, x) => a + x.g, 0);
  const d = Math.min(disc, G);
  const ex = isDel() ? extra : 0;
  L.forEach(x => {
    const sh = G ? x.g / G : 0;
    x.d = d * sh;
    x.e = ex * sh;
    x.gp = isDel() ? (x.g - x.d) * (S.set.gp || 0) : 0;
    x.net = x.g - x.d - x.gp - x.e;
    x.p = x.net - x.c;
  });
  const sum = k => L.reduce((a, x) => a + x[k], 0);
  return { L, G, d, ex, gp: sum('gp'), net: sum('net'), c: sum('c'), p: sum('p') };
}

function getStepsInfo(l) {
  const ev = String(l.steps || '').split(';').filter(Boolean).map(x => x.split('@')).sort((a, b) => (+a[1]) - (+b[1]));
  if (!ev.length) return null;
  const tot = Math.max(...ev.map(e => +e[1] || 0));
  return {
    tot,
    txt: 'All in at 0:00 → ' + ev.map(e => `pull <b>${esc(e[0])}</b> at <b>${e[1]}:00</b>`).join(', ')
  };
}

let isSyncing = false;
async function syncLiveState(isManual = false) {
  if (isSyncing) return;
  isSyncing = true;
  const syncBtn = $('syncBtn');
  const syncText = $('syncText');
  if (syncBtn) syncBtn.classList.add('spinning');
  if (syncText) syncText.textContent = 'Syncing…';

  try {
    const newState = await call('getState');
    if (newState && Array.isArray(newState.menu)) {
      newState.menu.forEach(m => {
        if (!m.img && DEFAULT_IMAGES[m.name]) {
          m.img = DEFAULT_IMAGES[m.name];
        }
      });
      S = newState;
      draw();
      if (isManual) toast('Data refreshed from Google Sheets & Drive!');
    }
  } catch (err) {
    console.warn('Sync failed:', err);
    if (isManual) toast('Sync failed: ' + (err.message || 'Check connection'));
  } finally {
    isSyncing = false;
    if (syncBtn) syncBtn.classList.remove('spinning');
    if (syncText) syncText.textContent = 'Sync';
  }
}

  await syncLiveState(false);

  const hasSauces = l.type !== 'addon' && l.brand === 'chicken';
  return `<div class="cart-line">
    <div class="row">
      <b style="font-size:14px">${esc(l.name.replace('Guck mal! ', ''))}</b>
      <span style="font-weight:700">${l.free ? `<s style="color:var(--ink-muted)">฿${f2(unitP(l) * l.qty)}</s> <span class="badge badge-amber">FREE</span>` : `฿${f2(x.g)}`}</span>
    </div>
    <div class="row" style="margin-top:6px;flex-wrap:wrap">
      <div class="qty-box">
        <button onclick="updateQty(${i}, -1)">−</button>
        <span>${l.qty}</span>
        <button onclick="updateQty(${i}, 1)">+</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:12px;color:var(--ink-muted)">฿</span>
        <input type="number" style="width:68px;padding:4px 7px" value="${unitP(l)}" onchange="cart[${i}].ov=this.value;vOrder()">
        <label style="font-size:12px;display:inline-flex;align-items:center;gap:3px;cursor:pointer">
          <input type="checkbox" ${l.free ? 'checked' : ''} onchange="cart[${i}].free=this.checked;vOrder()"> Free
        </label>
        <button class="chip" onclick="cart.splice(${i},1);vOrder()" title="Remove">✕</button>
      </div>
    </div>
    ${hasSauces ? `<div style="margin-top:6px">${SAUCES.map(s =>
      `<button class="chip ${l.sauces.includes(s) ? 'on' : ''}" onclick="toggleSauce(${i}, '${s}')">${s}${s === 'ทาร์ทาร์ซอส' ? ' (+฿' + (isDel() ? S.set.tartar_dl : S.set.tartar_in) + ')' : ''}</button>`
    ).join('')}</div>` : ''}
    <div style="margin-top:4px;font-size:11.5px;color:var(--ink-muted)">
      Unit cost: ฿${f2(unitC(l))} · Unit profit: <span class="${x.p < 0 ? 'neg' : 'pos'}">฿${f2(x.p / l.qty)}</span>
    </div>
  </div>`;
}

function addCartItem(idx) {
  const m = S.menu[idx];
  const existing = cart.find(l => l.name === m.name && l.brand === m.brand && !l.sauces.length && !l.free && l.ov == null);
  if (existing) existing.qty++;
  else cart.push({ ...m, qty: 1, sauces: [], free: false, ov: null });
  vOrder();
}

function updateQty(i, delta) {
  cart[i].qty += delta;
  if (cart[i].qty < 1) cart.splice(i, 1);
  vOrder();
}

function toggleSauce(i, s) {
  const arr = cart[i].sauces;
  const k = arr.indexOf(s);
  if (k >= 0) arr.splice(k, 1);
  else if (arr.length < 2) arr.push(s);
  else toast('Maximum 2 sauces per item');
  cart[i].ov = null;
  vOrder();
}

function renderTimeline() {
  const L = cart.filter(l => l.brand === 'chicken').map(l => ({ l, s: getStepsInfo(l) })).filter(x => x.s);
  if (!L.length) return '';
  const tot = L.reduce((a, x) => a + x.s.tot * x.l.qty, 0) + (+S.set.preheat || 0);
  return `<div class="panel">
    <div class="row">
      <b>🔥 Air Fryer Prep Schedule · 200°C</b>
      <span class="badge badge-amber">≈ ${tot} min total</span>
    </div>
    <div class="tl-step">Preheat air fryer: <b>${S.set.preheat} min</b></div>
    ${L.map(x => `<div class="tl-step"><b>${esc(x.l.name.replace('Guck mal! ', ''))}</b> ×${x.l.qty} (${x.s.tot} min/batch)<br>${x.s.txt}</div>`).join('')}
  </div>`;
}

function discardEdit() {
  editId = null;
  editDate = null;
  cart = [];
  disc = 0;
  extra = 0;
  vOrder();
}

async function checkout() {
  const t = calcCart();
  const wasEditing = !!editId;
  const id = editId || 'O' + Date.now().toString(36).toUpperCase();
  const d = editDate || new Date().toLocaleString('sv', { timeZone: 'Asia/Bangkok' });
  const rows = t.L.map(x => [
    d, id, x.l.brand, x.l.name, x.l.sauces.join('+'), x.l.qty, ch,
    unitP(x.l), x.l.free ? 'FREE' : '', r2(x.g), r2(x.d), r2(x.e),
    r2(x.gp), r2(x.net), r2(x.c), r2(x.p)
  ]);

  try {
    await (wasEditing ? call('replaceOrder', id, rows) : call('saveOrder', rows));
    lastSubmittedOrder = { id, channel: ch, net: t.net, profit: t.p };
    cart = [];
    disc = 0;
    extra = 0;
    editId = null;
    editDate = null;
    toast(wasEditing ? `Order #${id} updated!` : `Order #${id} saved!`);
    S = await call('getState');
    draw();
  } catch (e) {
    toast('Save failed: ' + e.message);
  }
}

// Custom Set Builder
function openCustomSet() {
  cust = {};
  const singles = S.menu.filter(m => m.brand === 'chicken' && m.type === 'single');
  $('custBox').innerHTML = `<div class="panel" style="border-color:var(--accent)">
    <div class="panel-header">
      <h3 style="margin:0">✨ Build Custom Chicken Set (${r2((S.set.bundle || 0) * 100)}% Bundle Discount)</h3>
      <button class="chip" onclick="$('custBox').innerHTML=''">✕ Close</button>
    </div>
    ${singles.map(m => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--border)">
      <span>${esc(m.name.replace('Guck mal! ', ''))} <small style="color:var(--ink-muted)">(฿${m.inn} in-store / ฿${m.dl} delivery)</small></span>
      <input type="number" min="0" value="0" onchange="cust[${S.menu.indexOf(m)}]=Math.max(0,+this.value||0);updateCustSummary()">
    </div>`).join('')}
    <div id="custSummary" style="margin:10px 0;font-size:13.5px;color:var(--ink-muted)">Select item quantities above.</div>
    <button class="btn btn-primary" onclick="addCustomSet()">Add Custom Set to Order</button>
  </div>`;
}

function calcCustomSet() {
  const ids = Object.keys(cust || {}).filter(k => cust[k] > 0);
  const b = S.set.bundle || 0;
  let innSum = 0, dlSum = 0, spSum = 0, food = [], names = [], stepList = [];
  ids.forEach(k => {
    const m = S.menu[k];
    const q = cust[k];
    innSum += m.inn * q;
    dlSum += m.dl * q;
    spSum += (m.sp || m.dl) * q;
    parsePairs(m.food).forEach(([fn, fq]) => food.push(`${fn}:${r2(fq * q)}`));
    if (m.steps) stepList.push(m.steps);
    names.push(`${q}× ${m.name.replace('Guck mal! ', '')}`);
  });
  return {
    ids,
    innSum,
    inn: roundTo9(innSum * (1 - b)),
    dl: roundTo9(dlSum * (1 - b)),
    sp: roundTo9(spSum * (1 - b)),
    food: food.join(';'),
    steps: stepList.join(';'),
    names,
    b
  };
}

function updateCustSummary() {
  const c = calcCustomSet();
  $('custSummary').innerHTML = c.ids.length
    ? `Singles total ฿${c.innSum} − ${r2(c.b * 100)}% bundle = <b>฿${c.inn}</b> In-store · <b>฿${c.dl}</b> Delivery`
    : 'Select item quantities above.';
}

function addCustomSet() {
  const c = calcCustomSet();
  if (!c.ids.length) return toast('Pick at least 1 item for the custom set');
  const template = S.menu.find(x => x.brand === 'chicken' && x.type === 'single');
  cart.push({
    brand: 'chicken',
    name: 'Custom Set (' + c.names.join(', ') + ')',
    type: 'custom',
    inn: c.inn,
    dl: c.dl,
    sp: c.sp,
    food: c.food,
    pack: template ? template.pack : '',
    steps: c.steps,
    qty: 1,
    sauces: [],
    free: false,
    ov: null
  });
  cust = null;
  vOrder();
}

// ==================== 2. ORDERS HISTORY (EDIT & CANCEL POST-SUBMISSION) ====================
function vOrders() {
  const groupOrders = (rows, isCancelled = false) => {
    const map = {};
    rows.forEach(r => {
      const id = isCancelled ? r[3] : r[1];
      (map[id] = map[id] || []).push(r);
    });
    return Object.entries(map).sort((a, b) => {
      const da = String(isCancelled ? a[1][0][2] : a[1][0][0]);
      const db = String(isCancelled ? b[1][0][2] : b[1][0][0]);
      return db.localeCompare(da);
    });
  };

  let activeList = groupOrders(S.sales, false);
  let cancelList = groupOrders(S.cancelled || [], true);

  const filterList = (list, isCancelled) => list.filter(([id, rows]) => {
    const sample = isCancelled ? rows[0].slice(2) : rows[0];
    if (ordBrandFilter !== 'all' && sample[2] !== ordBrandFilter) return false;
    if (ordChFilter !== 'all' && !matchCh(sample[6], ordChFilter)) return false;
    if (ordQuery.trim()) {
      const q = ordQuery.toLowerCase();
      const matchId = id.toLowerCase().includes(q);
      const matchItem = rows.some(r => String(isCancelled ? r[5] : r[3]).toLowerCase().includes(q));
      if (!matchId && !matchItem) return false;
    }
    return true;
  });

  const shown = ordSubTab === 'active' ? filterList(activeList, false) : filterList(cancelList, true);

  $('app').innerHTML = `
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      <div>
        <h2 style="margin:0">Order History & Management</h2>
        <small style="color:var(--ink-muted)">Edit items, adjust discounts, or cancel already submitted orders anytime.</small>
      </div>
      <div class="brand-switch">
        <button class="brand-pill ${ordSubTab === 'active' ? 'on' : ''}" onclick="ordSubTab='active';vOrders()">✅ Active Orders (${activeList.length})</button>
        <button class="brand-pill ${ordSubTab === 'cancelled' ? 'on' : ''}" onclick="ordSubTab='cancelled';vOrders()">🚫 Cancelled (${cancelList.length})</button>
      </div>
    </div>

    <div class="panel" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input type="search" placeholder="Search Order ID or menu item…" value="${esc(ordQuery)}" oninput="ordQuery=this.value;vOrders()" style="min-width:220px;flex:1">
      <select onchange="ordBrandFilter=this.value;vOrders()">
        <option value="all" ${ordBrandFilter === 'all' ? 'selected' : ''}>All Brands</option>
        <option value="chicken" ${ordBrandFilter === 'chicken' ? 'selected' : ''}>🍗 Guck mal! Chicken</option>
        <option value="cheesecake" ${ordBrandFilter === 'cheesecake' ? 'selected' : ''}>🧀 Kuu Kuu Cheesecake</option>
      </select>
      <select onchange="ordChFilter=this.value;vOrders()">
        <option value="all" ${ordChFilter === 'all' ? 'selected' : ''}>All Channels</option>
        ${CHN.map(c => `<option value="${c}" ${matchCh(ordChFilter, c) ? 'selected' : ''}>${c}</option>`).join('')}
      </select>
    </div>

    ${shown.length ? shown.map(([id, rawRows]) => {
      const isCanc = ordSubTab === 'cancelled';
      const rows = isCanc ? rawRows.map(r => r.slice(2)) : rawRows;
      const first = rows[0];
      const net = rows.reduce((a, x) => a + (+x[13] || 0), 0);
      const cost = rows.reduce((a, x) => a + (+x[14] || 0), 0);
      const profit = rows.reduce((a, x) => a + (+x[15] || 0), 0);
      const brandBadge = first[2] === 'chicken' ? '🍗 Guck mal!' : '🧀 Kuu Kuu';

      // Order edit/cancel time limit check
      const orderDateStr = String(first[0]).replace(' ', 'T');
      const orderTime = new Date(orderDateStr).getTime();
      const hoursElapsed = !isNaN(orderTime) ? (Date.now() - orderTime) / 3600000 : 0;
      const maxHours = (S.set && S.set.order_edit_hours != null) ? +S.set.order_edit_hours : 24;
      const isLocked = maxHours > 0 && hoursElapsed > maxHours;

      return `<div class="panel">
        <div class="row" style="flex-wrap:wrap;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="badge badge-neutral" style="font-weight:700">#${esc(id)}</span>
            <b>${esc(String(first[0]).slice(0, 16))}</b>
            <span class="badge badge-amber">${brandBadge}</span>
            <span class="badge badge-neutral">${esc(first[6])}</span>
            ${isCanc ? `<span class="badge badge-red">Cancelled (${esc(rawRows[0][1] || 'No reason')})</span>` : ''}
            ${(!isCanc && isLocked) ? `<span class="badge badge-neutral" style="opacity:0.8" title="Order is past ${maxHours}h edit window">🔒 Locked (${Math.floor(hoursElapsed)}h ago)</span>` : ''}
          </div>
          <div style="text-align:right">
            <span style="font-size:16px;font-weight:700">Net ฿${f2(net)}</span>
            <span class="badge ${profit < 0 ? 'badge-red' : 'badge-green'}" style="margin-left:6px">Profit ฿${f2(profit)}</span>
          </div>
        </div>

        <div style="background:var(--bg);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px">
          ${rows.map(x => `<div class="row" style="padding:2px 0">
            <span><b>${x[5]}×</b> ${esc(String(x[3]).replace('Guck mal! ', ''))} ${x[4] ? `<small style="color:var(--ink-muted)">[${esc(x[4])}]</small>` : ''} ${x[8] === 'FREE' ? '<span class="badge badge-amber">FREE</span>' : ''}</span>
            <span>฿${f2(x[9])}</span>
          </div>`).join('')}
        </div>

        <div class="row" style="flex-wrap:wrap">
          <small style="color:var(--ink-muted)">COGS: ฿${f2(cost)} · Gross: ฿${f2(rows.reduce((a, x) => a + (+x[9] || 0), 0))}</small>
          <div style="display:flex;gap:8px;align-items:center">
            ${!isCanc ? `
              ${!isLocked ? `
                <button class="btn btn-outline btn-sm" onclick="editOrder('${esc(id)}')">✏️ Edit Order</button>
                <button class="btn btn-danger-outline btn-sm" onclick="promptCancelOrder('${esc(id)}')">❌ Cancel Order</button>
              ` : `
                <button class="btn btn-outline btn-sm" disabled style="opacity:0.5;cursor:not-allowed" title="Modifications locked after ${maxHours}h">✏️ Edit</button>
                <button class="btn btn-danger-outline btn-sm" disabled style="opacity:0.5;cursor:not-allowed" title="Modifications locked after ${maxHours}h">❌ Cancel</button>
              `}
            ` : `
              ${!IS_GAS ? `<button class="btn btn-outline btn-sm" onclick="restoreCancelled('${esc(id)}')">↩️ Restore Order</button>` : ''}
            `}
          </div>
        </div>
      </div>`;
    }).join('') : `<div class="panel" style="text-align:center;padding:30px;color:var(--ink-muted)">No ${ordSubTab} orders found.</div>`}
  `;
}

function editOrder(id) {
  const rows = S.sales.filter(x => x[1] === id);
  if (!rows.length) return toast('Order not found');
  const orderTime = new Date(String(rows[0][0]).replace(' ', 'T')).getTime();
  const maxHours = (S.set && S.set.order_edit_hours != null) ? +S.set.order_edit_hours : 24;
  if (maxHours > 0 && !isNaN(orderTime) && (Date.now() - orderTime) / 3600000 > maxHours) {
    return toast(`Order #${id} is locked (past ${maxHours}h edit limit)`);
  }
  editId = id;
  editDate = rows[0][0];
  ch = rows[0][6];
  brand = rows[0][2];
  disc = r2(rows.reduce((a, x) => a + (+x[10] || 0), 0));
  extra = r2(rows.reduce((a, x) => a + (+x[11] || 0), 0));
  cart = rows.map(x => {
    const m = S.menu.find(y => y.name === x[3] && y.brand === x[2]);
    const q = +x[5] || 1;
    return {
      ...(m || { brand: x[2], name: x[3], type: 'custom', inn: 0, dl: 0, food: '', pack: '', steps: '', fc: (+x[14] || 0) / q }),
      qty: q,
      sauces: x[4] ? String(x[4]).split('+').filter(Boolean) : [],
      free: x[8] === 'FREE',
      ov: x[7]
    };
  });
  tab = 'order';
  draw();
  toast(`Loaded Order #${id} into POS for editing`);
}

function promptCancelOrder(id) {
  const rows = S.sales.filter(x => x[1] === id);
  if (rows.length) {
    const orderTime = new Date(String(rows[0][0]).replace(' ', 'T')).getTime();
    const maxHours = (S.set && S.set.order_edit_hours != null) ? +S.set.order_edit_hours : 24;
    if (maxHours > 0 && !isNaN(orderTime) && (Date.now() - orderTime) / 3600000 > maxHours) {
      return toast(`Order #${id} is locked (past ${maxHours}h edit limit)`);
    }
  }
  $('modalRoot').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)$('modalRoot').innerHTML=''">
    <div class="modal-card">
      <h3 style="margin-top:0;color:var(--red)">❌ Cancel Order #${esc(id)}?</h3>
      <p style="font-size:13.5px;color:var(--ink-muted)">This will remove the order from active revenue, profit, and payback totals and log it under Cancelled Orders.</p>
      <div style="margin:12px 0">
        <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:4px">Cancellation Reason (optional)</label>
        <input id="cancelReasonInput" type="text" placeholder="e.g., Customer cancelled, duplicate entry…" style="width:100%">
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
        <button class="btn btn-outline" onclick="$('modalRoot').innerHTML=''">Keep Order</button>
        <button class="btn btn-primary" style="background:var(--red)" onclick="confirmCancelOrder('${esc(id)}')">Confirm Cancel</button>
      </div>
    </div>
  </div>`;
}

async function confirmCancelOrder(id) {
  const reason = $('cancelReasonInput') ? $('cancelReasonInput').value.trim() : '';
  $('modalRoot').innerHTML = '';
  try {
    await call('cancelOrder', id, reason);
    if (lastSubmittedOrder && lastSubmittedOrder.id === id) lastSubmittedOrder = null;
    if (editId === id) discardEdit();
    S = await call('getState');
    toast(`Order #${id} cancelled`);
    draw();
  } catch (e) {
    toast('Cancel failed: ' + e.message);
  }
}

async function restoreCancelled(id) {
  try {
    await call('restoreOrder', id);
    S = await call('getState');
    toast(`Order #${id} restored to active sales`);
    draw();
  } catch (e) {
    toast(e.message);
  }
}

// ==================== 3. VISUAL ANALYTICS DASHBOARD ====================
function vDash() {
  const todayStr = new Date().toLocaleDateString('sv', { timeZone: 'Asia/Bangkok' });
  const nowMs = Date.now();

  const filterSales = rows => rows.filter(x => {
    if (dashBrand !== 'all' && x[2] !== dashBrand) return false;
    const dStr = String(x[0]).slice(0, 10);
    if (dashPeriod === 'today') return dStr === todayStr;
    if (dashPeriod === '7d') {
      const diff = (nowMs - new Date(dStr + 'T00:00:00').getTime()) / 86400000;
      return diff >= -1 && diff <= 7;
    }
    if (dashPeriod === 'month') return dStr.slice(0, 7) === todayStr.slice(0, 7);
    return true;
  });

  const rows = filterSales(S.sales);
  const agg = arr => {
    const o = new Set(arr.map(x => x[1])).size;
    const g = arr.reduce((a, x) => a + (+x[9] || 0), 0);
    const n = arr.reduce((a, x) => a + (+x[13] || 0), 0);
    const c = arr.reduce((a, x) => a + (+x[14] || 0), 0);
    const p = arr.reduce((a, x) => a + (+x[15] || 0), 0);
    return { o, g, n, c, p, margin: n > 0 ? (p / n) * 100 : 0, aov: o > 0 ? n / o : 0 };
  };

  const kpi = agg(rows);

  const paybackCard = b => {
    const meta = BRAND_META[b];
    const bRows = S.sales.filter(x => x[2] === b);

    const invTotal = (S.set['inv_' + b] || 0) + S.inv.filter(x => x[3] === b).reduce((acc, x) => acc + (+x[2] || 0), 0);
    const cumNet = (S.set['open_net_' + b] || 0) + a.n;
    const cumProfit = (S.set['open_profit_' + b] || 0) + a.p;
    const pct = invTotal > 0 ? Math.min(100, (cumNet / invTotal) * 100) : 0;

    return `<div class="panel">

function renderDashboardCharts(rows, chData, topItems) {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch (e) {} });
  charts = {};

  // Group daily trend
  const dailyMap = {};
  rows.forEach(x => {
    const d = String(x[0]).slice(0, 10);
    if (!dailyMap[d]) dailyMap[d] = { net: 0, cost: 0, profit: 0 };
    dailyMap[d].net += (+x[13] || 0);
    dailyMap[d].cost += (+x[14] || 0);
    dailyMap[d].profit += (+x[15] || 0);
  });
  const days = Object.keys(dailyMap).sort().slice(-14);

  if (typeof Chart === 'undefined') {
    // Crisp SVG fallback when offline without CDN
    $('trendChartBox').innerHTML = days.length ? renderSvgBarFallback(days.map(d => ({ label: d.slice(5), val: dailyMap[d].net }))) : '<div style="padding:30px;text-align:center;color:var(--ink-muted)">No sales data yet</div>';
    $('channelChartBox').innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:var(--ink-muted)">Channel breakdown shown on right</div>';
    if ($('topChartBox')) $('topChartBox').innerHTML = renderSvgBarFallback(topItems.map(([n, v]) => ({ label: n.slice(0, 14), val: v.qty })));
    return;
  }

  // 1. Trend Chart
  if ($('trendChart')) {
    charts.trend = new Chart($('trendChart'), {
      type: 'bar',
      data: {
        labels: days.length ? days.map(d => d.slice(5)) : ['No Data'],
        datasets: [
          {
            label: 'Net Revenue (฿)',
            data: days.length ? days.map(d => r2(dailyMap[d].net)) : [0],
            backgroundColor: 'rgba(230, 46, 45, 0.78)',
            borderRadius: 6
          },
          {
            label: 'Net Profit (฿)',
            data: days.length ? days.map(d => r2(dailyMap[d].profit)) : [0],
            type: 'line',
            borderColor: '#15803D',
            backgroundColor: '#15803D',
            tension: 0.3,
            borderWidth: 2.5,
            pointRadius: 4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }

  // 2. Channel Doughnut
  if ($('channelChart')) {
    const hasSales = chData.some(c => c.n > 0);
    charts.channel = new Chart($('channelChart'), {
      type: 'doughnut',
      data: {
        labels: hasSales ? chData.map(c => c.ch) : ['No Sales'],
        datasets: [{
          data: hasSales ? chData.map(c => r2(c.n)) : [1],
          backgroundColor: hasSales ? ['#E62E2D', '#16A34A', '#0284C7', '#F59E0B'] : ['#EAE0D2'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '64%',
        plugins: { legend: { display: false } }
      }
    });
  }

  // 3. Top Sellers Horizontal Bar
  if ($('topChart') && topItems.length) {
    charts.top = new Chart($('topChart'), {
      type: 'bar',
      data: {
        labels: topItems.map(([n]) => n),
        datasets: [{
          label: 'Units Sold',
          data: topItems.map(([, v]) => v.qty),
          backgroundColor: '#F5A623',
          borderRadius: 6
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { beginAtZero: true } }
      }
    });
  }
}

function renderSvgBarFallback(items) {
  const max = Math.max(1, ...items.map(i => i.val));
  return `<div style="display:flex;align-items:flex-end;gap:8px;height:200px;padding-top:20px">
    ${items.map(i => `<div style="flex:1;text-align:center">
      <div style="font-size:11px;font-weight:600;margin-bottom:4px">${f0(i.val)}</div>
      <div style="height:${Math.max(6, (i.val / max) * 140)}px;background:var(--primary);border-radius:6px 6px 0 0"></div>
      <div style="font-size:10.5px;color:var(--ink-muted);margin-top:4px">${esc(i.label)}</div>
    </div>`).join('')}
  </div>`;
}

// ==================== 4. REPORTS VIEW ====================
function vRep() {
  const keyFn = x => String(x[0]).slice(0, rp.by === 'day' ? 10 : 7);
  const G = {};
  S.sales
    .filter(x => (rp.b === 'all' || x[2] === rp.b) && (rp.c === 'all' || matchCh(x[6], rp.c)))
    .forEach(x => {
      const k = keyFn(x);
      const g = G[k] = G[k] || { o: new Set(), g: 0, n: 0, c: 0, p: 0 };
      g.o.add(x[1]);
      g.g += (+x[9] || 0);
      g.n += (+x[13] || 0);
      g.c += (+x[14] || 0);
      g.p += (+x[15] || 0);
    });

  const ks = Object.keys(G).sort().reverse();
  const mx = Math.max(1, ...ks.map(a => G[a].n));
  const T = { o: 0, g: 0, n: 0, c: 0, p: 0 };
  ks.forEach(a => {
    T.o += G[a].o.size;
    ['g', 'n', 'c', 'p'].forEach(f => T[f] += G[a][f]);
  });

  const chips = (key, L) => L.map(([v, t]) =>
    `<button class="chip ${rp[key] === v ? 'primary-on' : ''}" onclick="rp.${key}='${v}';vRep()">${t}</button>`
  ).join('');

  $('app').innerHTML = `
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      <div>
        <h2 style="margin:0">Financial Sales & Profit Reports</h2>
        <small style="color:var(--ink-muted)">Filter by period, brand, or channel and export CSV</small>
      </div>
      <button class="btn btn-outline btn-sm" onclick="exportSalesCsv()">⬇️ Export Sales CSV</button>
    </div>

    <div class="panel" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <div>${chips('by', [['day', 'Per Day'], ['month', 'Per Month']])}</div>
      <span style="color:var(--border-strong)">|</span>
      <div>${chips('b', [['all', 'All Brands'], ['chicken', '🍗 Guck mal!'], ['cheesecake', '🧀 Kuu Kuu']])}</div>
      <span style="color:var(--border-strong)">|</span>
      <div>${chips('c', [['all', 'All Channels'], ...CHN.map(c => [c, c])])}</div>
    </div>

    <div class="panel" style="overflow-x:auto">
      <table class="data-table">
        <tr>
          <th>${rp.by === 'day' ? 'Date' : 'Month'}</th>
          <th class="n">Orders</th>
          <th class="n">Gross Sales</th>
          <th class="n">Net Revenue</th>
          <th class="n">COGS</th>
          <th class="n">Net Profit</th>
          <th class="n">Margin</th>
        </tr>
        ${ks.length ? ks.map(a => {
          const mg = G[a].n > 0 ? (G[a].p / G[a].n) * 100 : 0;
          return `<tr>
            <td>
              <b>${a}</b>
              <div class="prog-track" style="height:6px;margin:4px 0 0"><div class="prog-fill" style="width:${(G[a].n / mx) * 100}%"></div></div>
            </td>
            <td class="n">${G[a].o.size}</td>
            <td class="n">฿${f2(G[a].g)}</td>
            <td class="n"><b>฿${f2(G[a].n)}</b></td>
            <td class="n">฿${f2(G[a].c)}</td>
            <td class="n ${G[a].p < 0 ? 'neg' : 'pos'}"><b>฿${f2(G[a].p)}</b></td>
            <td class="n">${r2(mg)}%</td>
          </tr>`;
        }).join('') : '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--ink-muted)">No sales recorded for selected filters.</td></tr>'}
        <tr style="background:var(--bg);font-weight:700">
          <td>Total</td>
          <td class="n">${T.o}</td>
          <td class="n">฿${f2(T.g)}</td>
          <td class="n">฿${f2(T.n)}</td>
          <td class="n">฿${f2(T.c)}</td>
          <td class="n ${T.p < 0 ? 'neg' : 'pos'}">฿${f2(T.p)}</td>
          <td class="n">${T.n > 0 ? r2((T.p / T.n) * 100) : 0}%</td>
        </tr>
      </table>
    </div>
  `;
}

function exportSalesCsv() {
  const headers = ['Date', 'Order', 'Brand', 'Item', 'Sauces', 'Qty', 'Channel', 'UnitPrice', 'Free', 'Gross', 'Discount', 'Extra', 'GP', 'NetRevenue', 'Cost', 'Profit'];
  const csvRows = [headers.join(',')].concat(S.sales.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')));
  const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `GuckMal_POS_Sales_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}

// ==================== 5. MENU & COSTS VIEW (DYNAMIC BRAND SEPARATION + CHECKBOX BOM + AIR FRYER BUILDER) ====================
function classifyIngCategory(name, entry) {
  if (entry && entry.cat) return entry.cat;
  const packKeywords = ['ถุง', 'กล่อง', 'ถ้วย', 'กระดาษ', 'ตะเกียบ', 'ช้อน', 'ค่าไฟ', 'ค่าน้ำมัน', 'กระปุก'];
  return packKeywords.some(k => name.includes(k)) ? 'pack' : 'ing';
}

function resetBuilder(targetBrand = brand) {
  builderState = {
    editRow: null,
    brand: targetBrand,
    type: 'single',
    name: '',
    inn: '',
    dl: '',
    sp: '',
    existingImg: '',
    foodMap: {}, // { itemName: qty }
    packMap: {}, // { packName: qty }
    stepsList: [], // [{ item: 'Thigh', min: 16 }]
    foodFilter: '',
    packFilter: ''
  };
}

function loadItemIntoBuilder(menuIdx) {
  const m = S.menu[menuIdx];
  if (!m) return;
  const fMap = {};
  parsePairs(m.food).forEach(([k, v]) => fMap[k] = v);
  const pMap = {};
  parsePairs(m.pack).forEach(([k, v]) => pMap[k] = v);
  const sList = String(m.steps || '').split(';').filter(Boolean).map(x => {
    const [item, min] = x.split('@');
    return { item: item.trim(), min: +min || 6 };
  });

  builderState = {
    editRow: m.row,
    brand: m.brand,
    type: m.type || 'single',
    name: m.name,
    inn: m.inn,
    dl: m.dl,
    sp: m.sp || '',
    existingImg: getMenuImg(m),
    foodMap: fMap,
    packMap: pMap,
    stepsList: sList,
    foodFilter: '',
    packFilter: ''
  };
  vMenu();
  const el = $('menuBuilderCard');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyRecipeFromItem(menuIdx) {
  if (menuIdx === '') return;
  const m = S.menu[+menuIdx];
  if (!m) return;
  builderState.foodMap = {};
  parsePairs(m.food).forEach(([k, v]) => builderState.foodMap[k] = v);
  builderState.packMap = {};
  parsePairs(m.pack).forEach(([k, v]) => builderState.packMap[k] = v);
  builderState.stepsList = String(m.steps || '').split(';').filter(Boolean).map(x => {
    const [item, min] = x.split('@');
    return { item: item.trim(), min: +min || 6 };
  });
  vMenu();
  toast(`Copied recipe & packaging from ${m.name}`);
}

function getFryableOptions() {
  const baseSet = new Set(['Thigh', 'Bites', 'Fries', 'Pop', 'Nuggets', 'Sticks']);
  S.menu.filter(m => m.brand === 'chicken').forEach(m => {
    String(m.steps || '').split(';').filter(Boolean).forEach(x => {
      const part = x.split('@')[0].trim();
      if (part) baseSet.add(part);
    });
    if (m.type === 'single') {
      baseSet.add(m.name.replace('Guck mal! ', '').trim());
    }
  });
  return Array.from(baseSet);
}

function renderRecipeCheckRow(mapKey, name, info) {
  const checked = Object.prototype.hasOwnProperty.call(builderState[mapKey], name);
  const qty = checked ? builderState[mapKey][name] : 1;
  const lineCost = checked ? (+qty || 0) * info.cost : 0;

  return `<div class="chk-item ${checked ? 'checked' : ''}">
    <label class="chk-label">
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleRecipeComponent('${mapKey}', '${esc(name)}', this.checked)">
      <span>${esc(name)} <small style="color:var(--ink-muted)">(฿${f2(info.cost)}/${esc(info.unit || 'unit')})</small></span>
    </label>
    ${checked ? `
      <div style="display:flex;align-items:center;gap:5px">
        <input type="number" step="any" min="0" value="${qty}" style="width:72px;padding:4px 6px;font-size:12.5px"
          oninput="builderState.${mapKey}['${esc(name)}']=+this.value||0;updateBuilderPreview()">
        <span style="font-size:11.5px;color:var(--ink-muted);min-width:26px">${esc(info.unit || '')}</span>
        <span style="font-size:12px;font-weight:700;min-width:54px;text-align:right">฿${f2(lineCost)}</span>
      </div>` : ''}
  </div>`;
}

function toggleRecipeComponent(mapKey, name, isChecked) {
  if (isChecked) {
    builderState[mapKey][name] = 1;
  } else {
    delete builderState[mapKey][name];
  }
  vMenu();
}

function addAirFryerStep() {
  const item = $('afItemSelect').value;
  const min = Math.max(1, +$('afMinInput').value || 6);
  if (!item) return;
  builderState.stepsList.push({ item, min });
  vMenu();
}

function updateBuilderPreview() {
  const estFoodCost = Object.entries(builderState.foodMap).reduce((a, [n, q]) => a + (+q || 0) * ic(n), 0);
  const estPackCost = Object.entries(builderState.packMap).reduce((a, [n, q]) => a + (+q || 0) * ic(n), 0);
  const estTotalCost = estFoodCost + estPackCost;
  const estInnProfit = (+builderState.inn || 0) - estTotalCost;
  const estDlNet = (+builderState.dl || +builderState.inn || 0) * (1 - (S.set.gp || 0));
  const estDlProfit = estDlNet - estTotalCost;
  const bar = $('builderPreviewBar');
  if (bar) {
    bar.firstElementChild.innerHTML = `
      <div>Total Unit COGS: <b>฿${f2(estTotalCost)}</b></div>
      <div>In-Store Profit: <b class="${estInnProfit < 0 ? 'neg' : 'pos'}">฿${f2(estInnProfit)}</b></div>
      <div>Delivery Profit (after GP): <b class="${estDlProfit < 0 ? 'neg' : 'pos'}">฿${f2(estDlProfit)}</b></div>
    `;
  }
}

function previewBuilderPhoto(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    $('builderImgPreview').innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;
  };
  reader.readAsDataURL(file);
}

async function saveBuilderMenuItem() {
  if (!builderState.name.trim() || !builderState.inn) {
    return toast('Please enter a Menu Name and In-Store Price');
  }
  const foodStr = Object.entries(builderState.foodMap).filter(([, q]) => +q > 0).map(([n, q]) => `${n}:${q}`).join(';');
  const packStr = Object.entries(builderState.packMap).filter(([, q]) => +q > 0).map(([n, q]) => `${n}:${q}`).join(';');
  const stepsStr = builderState.stepsList.map(s => `${s.item}@${s.min}`).join(';');
  const rowArr = [
    builderState.name.trim(),
    builderState.type,
    +builderState.inn,
    +builderState.dl || +builderState.inn,
    builderState.existingImg || '',
    foodStr,
    packStr,
    stepsStr,
    +builderState.sp || 0
  ];

  const fileInput = $('builderPhotoInput');
  const file = fileInput && fileInput.files && fileInput.files[0];

  const sendPayload = async imgObj => {
    try {
      if (builderState.editRow) {
        await call('updateMenu', builderState.brand, builderState.editRow, rowArr, imgObj);
        toast('Menu item updated!');
      } else {
        await call('addMenu', builderState.brand, rowArr, imgObj);
        toast('New menu item saved!');
      }
      resetBuilder(brand);
      S = await call('getState');
      S.menu.forEach(m => { if (!m.img && DEFAULT_IMAGES[m.name]) m.img = DEFAULT_IMAGES[m.name]; });
      vMenu();
    } catch (e) {
      toast('Error: ' + e.message);
    }
  };

  if (!file) return sendPayload(null);

  const im = new Image();
  im.onload = () => {
    const c = document.createElement('canvas');
    const size = 280;
    c.width = size;
    c.height = size;
    const minSide = Math.min(im.width, im.height);
    c.getContext('2d').drawImage(
      im,
      (im.width - minSide) / 2,
      (im.height - minSide) / 2,
      minSide,
      minSide,
      0,
      0,
      size,
      size
    );
    sendPayload({
      data: c.toDataURL('image/jpeg', 0.82).split(',')[1],
      mime: 'image/jpeg',
      name: builderState.name.trim() + '.jpg'
    });
  };
  im.src = URL.createObjectURL(file);
}

function renderIngCostRow(name, v) {
  return `<div class="set-row" style="padding:8px 0">
    <div>
      <div style="font-weight:600;font-size:13.5px">${esc(name)}</div>
      <div style="font-size:11.5px;color:var(--ink-muted)">Unit cost: <b>฿${f2(v.cost)}</b> / ${esc(v.unit || 'unit')}</div>
    </div>
    <div class="input-unit">
      <span>฿</span>
      <input type="number" step="any" value="${v.price}" style="width:85px" onchange="updateIngPrice('${esc(name)}', '${v.brand}', this.value)">

async function updateIngPrice(name, b, val) {
  try {
    await call('saveIng', b, name, +val);
    S = await call('getState');
    S.menu.forEach(m => { if (!m.img && DEFAULT_IMAGES[m.name]) m.img = DEFAULT_IMAGES[m.name]; });
    toast(`Updated price for ${name}`);
    vMenu();
  } catch (e) {
    toast(e.message);
  }
}

async function createNewIngredient() {
  const name = $('newIngName').value.trim();
  const cat = $('newIngCat').value;
  const price = +$('newIngPrice').value;
  const batch = +$('newIngBatch').value || 1;
  const unit = $('newIngUnit').value.trim() || 'unit';
  if (!name || !price) return toast('Enter material name and pack price');
  try {
    await call('addIng', brand, name, price, batch, unit, cat);
    S = await call('getState');
    S.menu.forEach(m => { if (!m.img && DEFAULT_IMAGES[m.name]) m.img = DEFAULT_IMAGES[m.name]; });
    toast(`Added ${name}`);
    vMenu();
  } catch (e) {
    toast(e.message);
  }
}

async function saveMenuPrice(b, row, col, val) {
  try {
    await call('savePrice', b, row, col, +val);
    const m = S.menu.find(x => x.brand === b && x.row === row);
    if (m) m[col === 3 ? 'inn' : col === 4 ? 'dl' : 'sp'] = +val;
    toast('Price updated');
    vMenu();
  } catch (e) {
    toast(e.message);
  }
}

function vSet() {
  const knownKeys = new Set(SETTING_GROUPS.flatMap(g => g.items.map(i => i.key)));
  const extraKeys = Object.keys(S.set).filter(k => !knownKeys.has(k));

  const renderSettingRow = item => {
    const rawVal = S.set[item.key] ?? 0;
    const displayVal = item.isPct ? r2(rawVal * 100) : rawVal;
    return `<div class="set-row">
      <div class="set-info">
        <div class="set-title">${esc(item.title)}</div>
        <div class="set-desc">${esc(item.desc)}</div>
      </div>
      <div class="input-unit">
        <input type="number" step="any" value="${displayVal}" onchange="updateSetting('${item.key}', this.value, ${!!item.isPct})">
        <span>${item.unit}</span>
      </div>
    </div>`;
  };

  const invSorted = S.inv.slice().sort((a, b) => String(b[0]).localeCompare(String(a[0])));

  $('app').innerHTML = `
    <div style="margin-bottom:14px">
      <h2 style="margin:0">POS Settings & Capital Tracking</h2>
      <small style="color:var(--ink-muted)">All changes save automatically</small>
    </div>

    ${SETTING_GROUPS.map(g => `
      <div class="panel">
        <h3 style="margin:0">${g.title}</h3>
        <small style="color:var(--ink-muted);display:block;margin-bottom:8px">${g.desc}</small>
        ${g.items.map(renderSettingRow).join('')}
      </div>
    `).join('')}

    ${extraKeys.length ? `
      <div class="panel">
        <h3>Additional Parameters</h3>
        ${extraKeys.map(k => renderSettingRow({
          key: k,
          title: k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),

          unit: 'val'
        })).join('')}

    <!-- CAPITAL INVESTMENTS LOG -->
    <div class="panel">
      <div class="panel-header">
        <div>
          <h3 style="margin:0">💸 Additional Capital Investments Log</h3>
          <small style="color:var(--ink-muted)">Record new equipment or supply investments added on top of Initial Startup Capital</small>
        </div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">

          <option value="chicken">🍗 Guck mal! Chicken</option>
          <option value="cheesecake">🧀 Kuu Kuu Cheesecake</option>
        </select>
        <input id="invDateInp" type="date" value="${new Date().toLocaleDateString('sv', { timeZone: 'Asia/Bangkok' })}">
        <input id="invItemInp" type="text" placeholder="What did you purchase? (e.g. Packaging stock)" style="flex:1;min-width:180px">
        <input id="invAmtInp" type="number" step="any" placeholder="Amount ฿" style="width:120px">
        <button class="btn btn-primary btn-sm" onclick="addInvestmentEntry()">+ Add Investment</button>
      </div>

      ${invSorted.length ? invSorted.map(x => `
        <div class="set-row" style="padding:8px 0">
          <div>
            <span class="badge badge-amber">${x[3] === 'chicken' ? '🍗 Guck mal!' : '🧀 Kuu Kuu'}</span>
            <b style="margin-left:6px">${esc(x[1])}</b>
            <small style="color:var(--ink-muted);margin-left:6px">${String(x[0]).slice(0, 10)}</small>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <b>฿${f2(x[2])}</b>
            <button class="chip" onclick="deleteInvestmentEntry('${x[3]}', ${x[4]})">✕</button>
          </div>
        </div>
      `).join('') : '<div style="font-size:13px;color:var(--ink-muted)">No additional dated investments logged yet.</div>'}

    <!-- STANDALONE / BACKUP UTILITIES -->

        <button class="btn btn-outline btn-sm" onclick="exportFullBackup()">⬇️ Download Full JSON Backup</button>

async function updateSetting(key, rawInput, isPct) {
  const num = +rawInput;
  if (Number.isNaN(num)) return;
  const storedVal = isPct ? r2(num / 100) : num;
  try {
    await call('saveSet', key, storedVal);
    S.set[key] = storedVal;
    toast('Setting saved');
  } catch (e) {
    toast(e.message);
  }
}

async function addInvestmentEntry() {
  const amt = +$('invAmtInp').value;
  const item = $('invItemInp').value.trim();
  if (!amt || !item) return toast('Enter description and amount');
  try {
    await call('addInvest', $('invBrandSel').value, $('invDateInp').value, item, amt);
    S = await call('getState');
    S.menu.forEach(m => { if (!m.img && DEFAULT_IMAGES[m.name]) m.img = DEFAULT_IMAGES[m.name]; });
    toast('Investment recorded');
    vSet();
  } catch (e) {
    toast(e.message);
  }
}

async function deleteInvestmentEntry(b, row) {
  if (!confirm('Delete this investment entry?')) return;
  try {
    await call('delInvest', b, row);
    S = await call('getState');
    S.menu.forEach(m => { if (!m.img && DEFAULT_IMAGES[m.name]) m.img = DEFAULT_IMAGES[m.name]; });
    toast('Investment removed');
    vSet();
  } catch (e) {
    toast(e.message);
  }
}

function exportFullBackup() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `GuckMal_POS_Backup_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}

function importFullBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.menu || !parsed.set) throw new Error('Invalid backup file');
      saveLocalDB(parsed);
      load();
      toast('Backup restored!');
    } catch (err) {
      toast('Failed to import backup: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function resetLocalDefaults() {
  if (!confirm('Reset local HTML storage back to the default menu, photos, and settings?')) return;
  localStorage.removeItem(STORAGE_KEY);
  load();
  toast('Reset to defaults');
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    syncLiveState(false);
  }
});
window.addEventListener('focus', () => {
  syncLiveState(false);
});
// Periodic background sync every 60 seconds
setInterval(() => {
  if (document.visibilityState === 'visible' && !isSyncing) {
    syncLiveState(false);
  }
}, 60000);

// Start POS
